---
- name: Assert supported OS family
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "Only Debian/Ubuntu hosts are supported (found {{ ansible_facts['os_family'] }})."
    quiet: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure time synchronisation is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

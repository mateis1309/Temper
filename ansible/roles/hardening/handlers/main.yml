---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ hardening_ssh_service }}"
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

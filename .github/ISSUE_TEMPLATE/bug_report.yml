---
name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. make up\n2. make deploy\n3. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `terraform version`, `ansible --version`, and the guest OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell

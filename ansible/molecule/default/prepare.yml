---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - openssh-server
          - sudo
          - ca-certificates
        update_cache: true

    - name: Create sshd privilege separation directory
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"

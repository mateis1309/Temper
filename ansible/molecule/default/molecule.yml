---
driver:
  name: docker

platforms:
  - name: temper-ubuntu2204
    # Override with a digest-pinned image for fully reproducible runs.
    image: ${MOLECULE_UBUNTU_IMAGE:-geerlingguy/docker-ubuntu2204-ansible:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups: [web]
  - name: temper-debian12
    image: ${MOLECULE_DEBIAN_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups: [web]

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        # Containers share the host kernel and have no usable UFW/sysctl/fail2ban.
        hardening_ufw_enabled: false
        hardening_sysctl_enabled: false
        hardening_fail2ban_enabled: false
        audit_check_firewall: false
        audit_check_sysctl: false
        audit_check_fail2ban: false
        audit_report_dir: ""

verifier:
  name: ansible

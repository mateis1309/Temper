---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# SSH is allowed (and rate limited) BEFORE the default policy flips to deny.
- name: Allow SSH with rate limiting
  community.general.ufw:
    rule: limit
    port: "{{ hardening_ssh_port }}"
    proto: tcp

- name: Allow configured TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ hardening_ufw_allowed_tcp_ports }}"

- name: Default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled
